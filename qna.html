        <header>
        <section id="qa" class="section">
  <div class="wrap">
    <div class="qa-grid">
      <div class="qa-text">
        <h2 class="heading">Any feedback or<br>question&nbsp;? <span class="emoji">🥺</span></h2>
        <h2 class="heading" style="margin-top:1.5rem;">Of course, you can<br>write your secret<br>letter here <span class="emoji">🥹</span></h2>
      </div>
      <div class="qa-form-wrap">
        <div class="info-card">
          <form id="qaForm">
            <div class="field">
              <label for="firstName">First Name</label>
              <input type="text" id="firstName" name="firstName">
            </div>
            <div class="field">
              <label for="lastName">Last Name</label>
              <input type="text" id="lastName" name="lastName">
            </div>
            <div class="field">
              <span class="field-label">Gender</span>
              <label class="radio-label"><input type="radio" name="gender" value="M"> M</label>
              <label class="radio-label"><input type="radio" name="gender" value="F"> F</label>
            </div>
            <div class="field">
              <label for="email">Email</label>
              <input type="email" id="email" name="email">
            </div>
            <div class="field">
              <label for="content">Content</label>
              <textarea id="content" name="content" rows="4"></textarea>
            </div>
            <div class="field-submit">
              <button type="submit" class="pill-btn">Submit</button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <div class="console-line">
      <p class="console-text">print("Thank you for visiting &lt;3")</p>
    </div>
  </div>
</section>
</header>
